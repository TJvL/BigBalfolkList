name: Generate

# Contributors edit dances.md and nothing else. This regenerates dances.json and the slug
# lock and commits them, so nobody has to install anything or run a script to contribute.

on:
  push:
    branches: [main]
    paths:
      - dances.md
      - scripts/**
      - .github/workflows/generate.yml
  pull_request:
    paths:
      - dances.md
      - scripts/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # No dependencies on purpose: the runner's Python is enough, so the barrier to
      # contributing stays at "can edit a markdown file in the browser".
      - name: Convert
        run: python3 scripts/convert.py

      # On a pull request the run above is the check: a malformed dances.md exits
      # non-zero and the check fails. Nothing is committed, which also means a pull
      # request from a fork needs no write access.
      - name: Commit the generated files
        if: github.event_name == 'push'
        run: |
          if [ -z "$(git status --porcelain dances.json slugs.lock.json)" ]; then
            echo "Already up to date."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dances.json slugs.lock.json
          git commit -m 'chore: regenerate dances.json'
          git push

      # A push made with GITHUB_TOKEN does not start another workflow run, so the commit
      # above cannot loop back into this job.
