name: Generate

# Contributors edit dances.md and nothing else. This regenerates dances.json and the slug
# lock and commits them, so nobody has to install anything or run a script to contribute.

on:
  push:
    branches: [main]
    paths:
      - dances.md
      - scripts/**
      - .github/workflows/generate.yml
  # Deliberately unfiltered. This job is a required check, and a required check that is
  # skipped never reports, which would leave every unrelated pull request blocked forever.
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # No dependencies on purpose: the runner's Python is enough, so the barrier to
      # contributing stays at "can edit a markdown file in the browser".
      - name: Convert
        run: python3 scripts/convert.py

      # On a pull request the run above is the check: a malformed dances.md exits
      # non-zero and the check fails, so nothing that cannot be converted reaches main.
      # Nothing is committed either, which is what lets a pull request from a fork run
      # with no write access at all.
      #
      # After a merge, the regenerated files arrive as their own pull request rather than
      # as a push. Main requires a pull request, and GitHub only lets Actions bypass that
      # on a paid organization plan, so the bot follows the same rule as everyone else.
      # Anything but a pull request: a push to main, and a manual run, which needs to be
      # able to repair main after something goes wrong.
      - name: Open a regeneration pull request
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain dances.json slugs.lock.json)" ]; then
            echo "Already up to date."
            exit 0
          fi

          BRANCH="chore/regenerate-${GITHUB_RUN_ID}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add dances.json slugs.lock.json
          git commit -m 'chore: regenerate dances.json'
          git push origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title 'chore: regenerate dances.json' \
            --body 'Generated from dances.md by the Generate workflow. Nothing here was written by hand.'

          gh pr merge "$BRANCH" --merge --delete-branch

      # A push made with GITHUB_TOKEN does not start another workflow run, so merging the
      # pull request above cannot loop back into this job.
